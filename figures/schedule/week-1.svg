<rect x="0" y="512" width="84" height="42" fill="#F2F2F2" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="6" y="530" font-size="12" fill="#1A1A1A" font-weight="bold">Resources</text>
<rect x="84.0" y="26" width="558.0" height="46" fill="#EDEDED" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="90" y="44" font-size="12" fill="#5A5A5A">Self-study: reading for the day, notebook, group branch</text>
<rect x="642.0" y="26" width="558.0" height="46" fill="#EDEDED" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="648" y="44" font-size="12" fill="#5A5A5A">Self-study: reading for the day, notebook, group branch</text>
<rect x="84.0" y="72" width="558.0" height="92" fill="#1F4E5F" stroke="#1A1A1A" stroke-width="2"/>
<text x="90" y="115" font-size="12" fill="#FFFFFF" font-weight="bold">Welcome address and introductory lecture: macrophages, why they matter,</text>
<text x="90" y="130" font-size="12" fill="#FFFFFF" font-weight="bold">why we do what we do (Joel Zindel), 09:00-10:15</text>
<rect x="642.0" y="72" width="558.0" height="138" fill="#C6E0B4" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="648" y="130" font-size="12" fill="#1A1A1A">Hands-on cell culture with the staff culture: hood and sterile technique,</text>
<text x="648" y="146" font-size="12" fill="#1A1A1A">microscope, P02 scrape, count, split and seed, cell counter. Then P01: thaw and</text>
<text x="648" y="160" font-size="12" fill="#1A1A1A">seed your group&#x27;s stock flask (course passage 0). Lab tour.</text>
<rect x="84.0" y="164" width="558.0" height="46" fill="#1F4E5F" stroke="#1A1A1A" stroke-width="2"/>
<text x="90" y="182" font-size="12" fill="#FFFFFF" font-weight="bold">Working in the lab and biosafety (Tea Kocijan), 10:30-12:00: Q&amp;A, then</text>
<text x="90" y="197" font-size="12" fill="#FFFFFF" font-weight="bold">the safety sheet is signed</text>
<rect x="84.0" y="210" width="558.0" height="46" fill="#EDEDED" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="90" y="228" font-size="12" fill="#5A5A5A">Lunch</text>
<rect x="642.0" y="210" width="558.0" height="46" fill="#EDEDED" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="648" y="228" font-size="12" fill="#5A5A5A">Lunch</text>
<rect x="84.0" y="256" width="558.0" height="46" fill="#1F4E5F" stroke="#1A1A1A" stroke-width="2"/>
<text x="90" y="274" font-size="12" fill="#FFFFFF" font-weight="bold">Introduction of the supervisors (what they do and why) and group</text>
<text x="90" y="289" font-size="12" fill="#FFFFFF" font-weight="bold">formation</text>
<rect x="642.0" y="256" width="558.0" height="184" fill="#FFE699" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="648" y="308" font-size="12" fill="#1A1A1A">Working with git and RStudio, step by step with the supervisors: GitHub account,</text>
<text x="648" y="322" font-size="12" fill="#1A1A1A">install R, RStudio and Git if you did not at home, token, clone the course</text>
<text x="648" y="338" font-size="12" fill="#1A1A1A">repository from RStudio, switch to your group&#x27;s branch, open the ELISA script and</text>
<text x="648" y="352" font-size="12" fill="#1A1A1A">run it. Then the first commit: a new text file in notebooks/ with your first</text>
<text x="648" y="368" font-size="12" fill="#1A1A1A">notes, saved under a name you like, committed as &quot;hello world&quot; and pushed to your</text>
<text x="648" y="382" font-size="12" fill="#1A1A1A">branch. Then the rest of the environment with your AI tool. Group plan (the</text>
<text x="648" y="398" font-size="12" fill="#1A1A1A">drawing and your menu choices) committed to the group branch at 17:00.</text>
<rect x="84.0" y="302" width="558.0" height="138" fill="#FFE699" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="90" y="353" font-size="12" fill="#1A1A1A">Experiment planning with your supervisors: hand-draw the pathway you will test</text>
<text x="90" y="368" font-size="12" fill="#1A1A1A">(ligand, receptor, output, how an inhibitor proves it, where the polarizer acts),</text>
<text x="90" y="383" font-size="12" fill="#1A1A1A">pick your polarizer, stimulus and cytokine (P04, P05, P06) and your extension.</text>
<text x="90" y="398" font-size="12" fill="#1A1A1A">Read P01, P02 and P08 for Friday and Tuesday.</text>
<rect x="84.0" y="440" width="558.0" height="72" fill="#FAFAFA" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="90" y="458" font-size="12" fill="#1A1A1A">Rooms, safety officer. Signed safety sheets collected at 12:00. Supervisors sit</text>
<text x="90" y="473" font-size="12" fill="#1A1A1A">with their group from 14:00.</text>
<rect x="642.0" y="440" width="558.0" height="72" fill="#FAFAFA" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="648" y="458" font-size="12" fill="#1A1A1A">One low-passage vial per group. Supervisors carry the stock flasks over the</text>
<text x="648" y="473" font-size="12" fill="#1A1A1A">weekend and the break: split every 2 to 3 days, course passage counted from this</text>
<text x="648" y="488" font-size="12" fill="#1A1A1A">thaw. Afternoon: one supervisor per two laptops; the 08:00 slot is the</text>
<text x="648" y="503" font-size="12" fill="#1A1A1A">installation help desk for latecomers. Collect the plans at 17:00.</text>
<rect x="84.0" y="512" width="558.0" height="42" fill="#FAFAFA" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="90" y="530" font-size="12" fill="#1A1A1A">Conference room HPL F22 for lectures and dry lab.</text>
<rect x="642.0" y="512" width="558.0" height="42" fill="#FAFAFA" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="648" y="530" font-size="12" fill="#1A1A1A">4 hoods HPL F27.2, one per group, available at all times. Cell counter.</text>
<text x="648" y="545" font-size="12" fill="#1A1A1A">Conference room HPL F22 for lectures and dry lab. Own laptops, Wi-Fi.</text>
<text x="4" y="578" font-size="12" font-weight="bold" fill="#1A1A1A">Legend</text>
<rect x="4" y="586" width="26" height="13" fill="#1F4E5F" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="36" y="597" font-size="11" fill="#1A1A1A">Plenary, lecture, debrief (fixed)</text>
<rect x="604" y="586" width="26" height="13" fill="#8B1E3F" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="636" y="597" font-size="11" fill="#1A1A1A">Facility slot: cytometer, facility lecture (fixed, reserved)</text>
<rect x="4" y="604" width="26" height="13" fill="#C6E0B4" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="36" y="615" font-size="11" fill="#1A1A1A">Wet lab Exp 1: polarize and characterize (plate with the polarizer, harvest, stain, acquire)</text>
<rect x="604" y="604" width="26" height="13" fill="#BDD7EE" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="636" y="615" font-size="11" fill="#1A1A1A">Wet lab Exp 3: polarize and challenge (plate, stimulate, harvest, ELISA)</text>
<rect x="4" y="622" width="26" height="13" fill="#FFE699" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="36" y="633" font-size="11" fill="#1A1A1A">Dry lab and desk work: setup, analysis, planning</text>
<rect x="604" y="622" width="26" height="13" fill="#D9C3E9" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="636" y="633" font-size="11" fill="#1A1A1A">Poster and writing: introduction, significance, figures</text>
<rect x="4" y="640" width="26" height="13" fill="#F8CBAD" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="36" y="651" font-size="11" fill="#1A1A1A">Extension / nerd factor (group&#x27;s choice)</text>
<rect x="604" y="640" width="26" height="13" fill="#EDEDED" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="636" y="651" font-size="11" fill="#1A1A1A">Buffer / free</text>
