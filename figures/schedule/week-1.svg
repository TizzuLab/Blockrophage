<text x="90" y="307" font-size="12" fill="#1A1A1A">Experiment planning with your supervisors: hand-draw the pathway you will test</text>
<text x="90" y="322" font-size="12" fill="#1A1A1A">(ligand, receptor, output, how an inhibitor proves it), pick your polarizer,</text>
<text x="90" y="337" font-size="12" fill="#1A1A1A">stimulus and cytokine (P04, P05, P06) and your extension. Read P01, P02 and P09</text>
<text x="90" y="352" font-size="12" fill="#1A1A1A">for Friday and Tuesday.</text>
<rect x="84.0" y="394" width="558.0" height="57" fill="#FAFAFA" stroke="#BFBFBF" stroke-width="0.8"/>
<text x="90" y="412" font-size="12" fill="#1A1A1A">Rooms, safety officer. Groups formed at 13:00; supervisors sit with their group</text>
