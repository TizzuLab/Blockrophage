name: Build companion

# Generated files (schedule drawings, the README schedule block, schedule_text.md,
# the companion) are regenerated on pull-request branches and committed there.
# On main the job only verifies that nothing is stale: main is protected and
# nobody, including this workflow, pushes to it directly.

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pdftotext
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Regenerate schedule drawings
        run: |
          pip install -q openpyxl
          python tools/schedule/gantt2readme.py
      - name: Build companion
        run: python tools/build_companion.py --max-tokens 150000
      - name: Upload companion as artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockcourse-companion
          path: companion/blockcourse-companion.md
      - name: Commit regenerated files to the pull-request branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "course-bot"
          git config user.email "course-bot@users.noreply.github.com"
          git add README.md figures/schedule tools/schedule/schedule_text.md companion/blockcourse-companion.md
          git diff --cached --quiet || git commit -m "Regenerate schedule drawings and companion"
          git push
      - name: Verify that main is not stale
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet -- README.md figures/schedule tools/schedule/schedule_text.md companion/blockcourse-companion.md; then
            echo "Generated files on main are stale. Regenerate on a branch and open a pull request."
            git status --short
            exit 1
          fi

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blockcourse-companion
      - uses: softprops/action-gh-release@v2
        with:
          files: blockcourse-companion.md
