name: Build companion

# Branch model (since 2026-10-28):
# - dev is the workshop, unprotected. On every push to dev this job rebuilds the
#   generated files (schedule drawings, README schedule and companion blocks,
#   schedule_text.md, both companion files) and commits them back to dev.
# - main is the published, student-facing branch, protected: changes arrive only
#   through a pull request (normally dev -> main) and this job must pass. On a
#   pull request and on main the job only verifies that nothing is stale.

on:
  push:
    branches: [main, dev]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pdftotext and openpyxl
        run: |
          sudo apt-get install -y -qq poppler-utils || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          pip install -q openpyxl
      - name: Regenerate schedule drawings
        run: python tools/schedule/gantt2readme.py
      - name: Build companion
        run: |
          python tools/build_companion.py --max-tokens 150000
          python tools/build_companion.py --core
      - name: Upload companion as artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockcourse-companion
          path: companion/blockcourse-companion.md
      - name: Commit regenerated files to dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md figures/schedule tools/schedule/schedule_text.md companion/
          if git diff --cached --quiet; then
            echo "Nothing to regenerate."
            exit 0
          fi
          git commit -m "Regenerate schedule drawings and companion"
          git pull --rebase origin dev
          git push origin HEAD:dev
      - name: Verify that nothing is stale
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- README.md figures/schedule tools/schedule/schedule_text.md companion/; then
            echo "::error::Generated files are stale. Push to dev, wait about a minute for the regeneration commit, then the pull request updates itself."
            git status --short
            exit 1
          fi

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blockcourse-companion
      - uses: softprops/action-gh-release@v2
        with:
          files: blockcourse-companion.md
