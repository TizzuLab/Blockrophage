name: Build companion

# Generated files (schedule drawings, the README schedule block, schedule_text.md,
# the companion) are regenerated on pull-request branches and committed there.
# On main the job only verifies that nothing is stale: main is protected and
# nobody, including this workflow, pushes to it directly.

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pdftotext
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Regenerate schedule drawings
        run: |
          pip install -q openpyxl
          python tools/schedule/gantt2readme.py
      - name: Build companion
        run: |
          python tools/build_companion.py --max-tokens 150000
          python tools/build_companion.py --core
      - name: Upload companion as artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockcourse-companion
          path: companion/blockcourse-companion.md
      - name: Commit regenerated files to the pull-request branch
        id: commit
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md figures/schedule tools/schedule/schedule_text.md companion/
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Regenerate schedule drawings and companion"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      # A commit pushed with the workflow token starts no new run, so the required
      # "build" check would never appear on it. Report it here instead.
      - name: Report the build check on the regenerated commit
        if: steps.commit.outputs.pushed == 'true'
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ steps.commit.outputs.sha }}" \
            -d '{"state":"success","context":"build","description":"Regenerated by the build job of the previous commit"}'
      - name: Verify that main is not stale
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet -- README.md figures/schedule tools/schedule/schedule_text.md companion/; then
            echo "Generated files on main are stale. Regenerate on a branch and open a pull request."
            git status --short
            exit 1
          fi

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blockcourse-companion
      - uses: softprops/action-gh-release@v2
        with:
          files: blockcourse-companion.md
