name: Build companion

# Generated files (schedule drawings, the README schedule block and companion
# block, schedule_text.md, the companion files) are rebuilt by this job.
# On a pull request it only builds, so the author sees that the sources build.
# After a merge to main it rebuilds and, if anything changed, pushes one commit
# to main as github-actions[bot], authenticated with the admin's token
# COURSE_BOT_TOKEN, which the ruleset lets through.

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pdftotext and openpyxl
        run: |
          sudo apt-get install -y -qq poppler-utils || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          pip install -q openpyxl
      - name: Regenerate schedule drawings
        run: python tools/schedule/gantt2readme.py
      - name: Build companion
        run: |
          python tools/build_companion.py --max-tokens 150000
          python tools/build_companion.py --core
      - name: Upload companion as artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockcourse-companion
          path: companion/blockcourse-companion.md
      - name: Commit regenerated files to main
        # Pushes with COURSE_BOT_TOKEN, a fine-grained token of the repository
        # admin limited to this repository (Contents: read and write). The push
        # counts as the admin, whom the ruleset lets through. The token is used
        # for this push only; a missing token breaks nothing else.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COURSE_BOT_TOKEN: ${{ secrets.COURSE_BOT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md figures/schedule tools/schedule/schedule_text.md companion/
          if git diff --cached --quiet; then
            echo "Nothing to regenerate."
            exit 0
          fi
          git commit -m "Regenerate schedule drawings and companion"
          if [ -z "$COURSE_BOT_TOKEN" ]; then
            echo "::error::The secret COURSE_BOT_TOKEN is not set; the regenerated files could not be pushed to main."
            exit 1
          fi
          git push "https://x-access-token:${COURSE_BOT_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blockcourse-companion
      - uses: softprops/action-gh-release@v2
        with:
          files: blockcourse-companion.md
