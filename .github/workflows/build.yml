name: Build companion

# Generated files (schedule drawings, the README schedule block and companion
# block, schedule_text.md, the companion files) are rebuilt by this job.
# On a pull request it only builds, so the author sees that the sources build.
# After a merge to main it rebuilds and, if anything changed, pushes one commit
# to main as github-actions[bot]; the ruleset lets this job bypass the
# pull-request requirement for that push alone.

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pdftotext and openpyxl
        run: |
          sudo apt-get install -y -qq poppler-utils || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          pip install -q openpyxl
      - name: Regenerate schedule drawings
        run: python tools/schedule/gantt2readme.py
      - name: Build companion
        run: |
          python tools/build_companion.py --max-tokens 150000
          python tools/build_companion.py --core
      - name: Upload companion as artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockcourse-companion
          path: companion/blockcourse-companion.md
      - name: Commit regenerated files to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md figures/schedule tools/schedule/schedule_text.md companion/
          git diff --cached --quiet || git commit -m "Regenerate schedule drawings and companion"
          git push

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blockcourse-companion
      - uses: softprops/action-gh-release@v2
        with:
          files: blockcourse-companion.md
